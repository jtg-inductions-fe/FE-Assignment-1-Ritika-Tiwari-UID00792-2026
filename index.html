<!doctype html>
<html lang="en">
    <head>
        <title>Travel App</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Explore affordable tour packages., Book flights, hotels, save big on your next trip!"
        />
        <meta name="author" content="Ritika Tiwari" />

        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>

    <body>
        <header class="header" id="home">
            <div class="header__container container navigation-open">
                <div class="header__container__logo">
                    <img src="/assets/images/logo.svg" alt="Brand Logo" />
                </div>
                <nav class="navigation" aria-label="Main Navigation">
                    <button class="navigation__close-btn">
                        <i class="icon-close"></i>
                    </button>
                    <ul class="navigation__section--start">
                        <li id="home">
                            <a
                                class="navigation__link is-active"
                                href="index.html"
                                >Home</a
                            >
                        </li>
                        <li id="discover">
                            <a class="navigation__link" href="#">Discover</a>
                        </li>

                        <li id="deals">
                            <a class="navigation__link" href="#"
                                >Special Deals</a
                            >
                        </li>
                        <li id="contact">
                            <a class="navigation__link" href="#">Contact</a>
                        </li>
                    </ul>
                </nav>
                <button class="header__container__hamburger">
                    <i class="icon-hamburger"></i>
                </button>
                <div class="auth__section">
                    <a class="navigation__link" href="#">Log In</a>
                    <a class="navigation__link button button--primary" href="#"
                        >Sign Up</a
                    >
                </div>
            </div>
        </header>
        <section class="hero">
            <div class="hero__container">
                <div class="hero__visuals">
                    <div class="hero__image-container">
                        <img
                            src="./assets/images/profile.svg"
                            class="overlay-items profile-item"
                            alt="Profile icon"
                        />
                        <img
                            src="./assets/images/send.svg"
                            class="overlay-items send-item"
                            alt="Send icon"
                        />
                        <img
                            src="./assets/images/top-places.svg"
                            class="overlay-items top-place-item"
                            alt="Top place"
                        />
                        <div class="hero__image-group hero__image-group--left">
                            <figure>
                                <img
                                    src="./assets/images/visual-image-2.svg"
                                    alt="Travelling Image"
                                    style="width: 100%"
                                />
                            </figure>
                            <figure>
                                <img
                                    src="./assets/images/visual-image-3.svg"
                                    alt="Travelling Image"
                                    style="width: 100%"
                                />
                            </figure>
                        </div>
                        <div class="hero__image-group hero__image-group--right">
                            <figure>
                                <img
                                    src="./assets/images/visual-image-1.svg"
                                    alt="Travelling image"
                                    style="width: 100%"
                                />
                            </figure>
                        </div>
                    </div>
                </div>
                <div class="hero__actions">
                    <h2 class="hero__tagline">
                        Explore the World!<i class="icon-bag"></i>
                    </h2>
                    <h1 class="hero__heading">
                        Travel
                        <span class="hero__heading--highlight"
                            >top destination</span
                        >
                        of the world
                    </h1>
                    <p class="hero__caption">
                        We always make our customer happy by providing as many
                        choices as possible
                    </p>
                    <button class="button button--primary">Get Started</button>
                    <button class="button button--secondary">
                        <i class="icon-watch-demo-icon"></i>Watch Demo
                    </button>
                </div>
            </div>
            <div class="hero__brands"></div>
        </section>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
